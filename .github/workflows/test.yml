name: Test and Coverage

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create Env File
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_CONTENT }}
          EOF

      - name: Install Dependencies
        run: npm ci

      - name: Create tmp directory for potential mock setups
        run: mkdir -p tmp

      - name: Run Domain and Shared Tests with Coverage
        run: >-
          npm test -- src/domain src/shared
          --coverage
          --coverageDirectory="coverage/domain-shared"
          --coverageReporters="json"
          --maxWorkers=2

      - name: Run Application Tests with Coverage
        run: >-
          npm test -- src/app
          --coverage
          --coverageDirectory="coverage/app"
          --coverageReporters="json"
          --maxWorkers=2

      - name: Run Infrastructure and Interface Tests with Coverage
        run: >-
          npm test -- src/infra src/interface
          --coverage
          --coverageDirectory="coverage/infra-interface"
          --coverageReporters="json"
          --maxWorkers=2

      - name: Run HTTP Tests with Coverage
        run: >-
          npm test -- test/http
          --coverage
          --coverageDirectory="coverage/http"
          --coverageReporters="json"
          --maxWorkers=2

      - name: Merge Coverage Reports
        run: node scripts/merge-coverage.mjs

      - name: Generate Coverage Badge
        if: github.ref == 'refs/heads/development' && github.event_name == 'push'
        run: |
          mkdir -p badges
          COVERAGE=$(node -e "const summary = require('./coverage/coverage-summary.json'); console.log(summary.total.lines.pct);")
          echo "Coverage is $COVERAGE%"

          COLOR="red"
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="yellow"
          fi

          curl -s "https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}" > badges/coverage.svg

      - name: Commit and Push Coverage Badge
        if: github.ref == 'refs/heads/development' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add badges/coverage.svg
          git commit -m "chore(coverage): update badge [skip ci]" || echo "No changes to commit"
          git push
